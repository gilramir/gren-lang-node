[package]
name = "github.com/geng-language/node"
version = "6.1.3"
summary = "Run Gren on Node.js"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "node"

[modules]
exposed = [
    "Node",
    "Terminal",
    "ChildProcess",
    "FileSystem",
    "FileSystem.FileHandle",
    "FileSystem.Path",
    "HttpClient",
    "HttpServer",
    "HttpServer.Response",
    "WebSocketServer",
    "WebSocketServer.Connection",
]

[dependencies]
"github.com/geng-language/stream" = "0.1.0 <= v < 0.2.0"
"github.com/geng-language/url" = "6.0.0 <= v < 7.0.0"
